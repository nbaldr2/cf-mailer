<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ subject }}</title>
    <!--[if mso]>
    <noscript>
        <xml>
            <o:OfficeDocumentSettings>
                <o:PixelsPerInch>96</o:PixelsPerInch>
            </o:OfficeDocumentSettings>
        </xml>
    </noscript>
    <![endif]-->
    <style>
        /* Reset */
        body, table, td, a { -webkit-text-size-adjust: 100%; -ms-text-size-adjust: 100%; }
        table, td { mso-table-lspace: 0pt; mso-table-rspace: 0pt; }
        img { -ms-interpolation-mode: bicubic; border: 0; height: auto; line-height: 100%; outline: none; text-decoration: none; }
        body { margin: 0; padding: 0; width: 100% !important; height: 100% !important; }

        /* Typography */
        body, td, p { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; }

        /* Dark mode support */
        @media (prefers-color-scheme: dark) {
            .email-body { background-color: #1a1a2e !important; }
            .email-container { background-color: #16213e !important; }
            .email-header { background: linear-gradient(135deg, #0f3460, #533483) !important; }
            .email-content td { color: #e0e0e0 !important; }
            .email-footer td { color: #a0a0a0 !important; }
        }
    </style>
</head>
<body style="margin: 0; padding: 0; background-color: #f0f2f5;">
    <table role="presentation" class="email-body" cellpadding="0" cellspacing="0" width="100%" style="background-color: #f0f2f5;">
        <tr>
            <td align="center" style="padding: 40px 10px;">
                <!-- Email Container -->
                <table role="presentation" class="email-container" cellpadding="0" cellspacing="0" width="600" style="max-width: 600px; background-color: #ffffff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 24px rgba(0,0,0,0.08);">
                    
                    <!-- Header -->
                    <tr>
                        <td class="email-header" style="background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); padding: 40px 40px 30px 40px; text-align: center;">
                            <h1 style="margin: 0; color: #ffffff; font-size: 28px; font-weight: 700; letter-spacing: -0.5px;">
                                {{ company_name }}
                            </h1>
                        </td>
                    </tr>

                    <!-- Content -->
                    <tr>
                        <td class="email-content" style="padding: 40px;">
                            <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td style="color: #333333; font-size: 16px; line-height: 1.6;">
                                        <h2 style="margin: 0 0 16px 0; color: #1a1a2e; font-size: 22px; font-weight: 600;">
                                            Hello, {{ recipient_name }}! 👋
                                        </h2>
                                        <p style="margin: 0 0 20px 0;">
                                            {{{ message_body }}}
                                        </p>
                                    </td>
                                </tr>

                                <!-- CTA Button -->
                                <tr>
                                    <td align="center" style="padding: 20px 0 30px 0;">
                                        <table role="presentation" cellpadding="0" cellspacing="0">
                                            <tr>
                                                <td align="center" style="border-radius: 8px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);">
                                                    <a href="{{ cta_url }}" target="_blank" style="display: inline-block; padding: 14px 36px; color: #ffffff; font-size: 16px; font-weight: 600; text-decoration: none; border-radius: 8px;">
                                                        {{ cta_text }}
                                                    </a>
                                                </td>
                                            </tr>
                                        </table>
                                    </td>
                                </tr>

                                <!-- Divider -->
                                <tr>
                                    <td style="padding: 0 0 20px 0;">
                                        <hr style="border: none; border-top: 1px solid #e8e8e8; margin: 0;">
                                    </td>
                                </tr>

                                <!-- Secondary Content -->
                                <tr>
                                    <td style="color: #666666; font-size: 14px; line-height: 1.6;">
                                        <p style="margin: 0;">
                                            If you have any questions, just reply to this email — we're always happy to help.
                                        </p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                    <!-- Footer -->
                    <tr>
                        <td class="email-footer" style="background-color: #f8f9fa; padding: 24px 40px; text-align: center; border-top: 1px solid #e8e8e8;">
                            <table role="presentation" cellpadding="0" cellspacing="0" width="100%">
                                <tr>
                                    <td style="color: #999999; font-size: 12px; line-height: 1.5;">
                                        <p style="margin: 0 0 8px 0;">
                                            © {{ year }} {{ company_name }}. All rights reserved.
                                        </p>
                                        <p style="margin: 0 0 8px 0;">
                                            {{ company_address }}
                                        </p>
                                        <p style="margin: 0;">
                                            <a href="{{ unsubscribe_url }}" style="color: #667eea; text-decoration: underline;">Unsubscribe</a>
                                            &nbsp;&bull;&nbsp;
                                            <a href="{{ privacy_url }}" style="color: #667eea; text-decoration: underline;">Privacy Policy</a>
                                        </p>
                                    </td>
                                </tr>
                            </table>
                        </td>
                    </tr>

                </table>
            </td>
        </tr>
    </table>
</body>
</html>
